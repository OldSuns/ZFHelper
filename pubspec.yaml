name: zfhelper
description: "Android-first academic timetable and course client for ZFHelper."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'

dependencies:
  cookie_jar: ^4.0.9
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^11.1.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  zf_core:
    path: packages/zf_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
